<!DOCTYPE html>
<html>
<head>
    <title>Marksheet Form</title>
</head>
<body>

<h1>Marksheet Form</h1>

<form>
    <label for="maths">Maths:</label>
    <input type="number" id="maths"><br><br>

    <label for="science">Science:</label>
    <input type="number" id="science"><br><br>

    <label for="english">English:</label>
    <input type="number" id="english"><br><br>

    <label for="history">History:</label>
    <input type="number" id="history"><br><br>

    <label for="geography">Geography:</label>
    <input type="number" id="geography"><br><br>

    <label for="computer">Computer:</label>
    <input type="number" id="computer"><br><br>

    <label for="nepali">Nepali:</label>
    <input type="number" id="nepali"><br><br>

    <label for="social">Social Studies:</label>
    <input type="number" id="social"><br><br>

    <button type="button" onclick="calculate()">Calculate</button>
</form>

<p id="result"></p>

<script>
function calculate() {
    const maths = Number(document.getElementById('maths').value);
    const science = Number(document.getElementById('science').value);
    const english = Number(document.getElementById('english').value);
    const history = Number(document.getElementById('history').value);
    const geography = Number(document.getElementById('geography').value);
    const computer = Number(document.getElementById('computer').value);
    const nepali = Number(document.getElementById('nepali').value);
    const social = Number(document.getElementById('social').value);


    const total = maths + science + english + history +
                  geography + computer + nepali + social;

    if (total >= 700) {
        document.getElementById('result').innerHTML =
            'Total: ' + total + '<br>You passed with Distinction';
        document.getElementById('result').style.backgroundColor = 'green';
    }
    else if (total >= 600) {
        document.getElementById('result').innerHTML =
            'Total: ' + total + '<br>You passed with First Division';
    }
    else if (total >= 500) {
        document.getElementById('result').innerHTML =
            'Total: ' + total + '<br>You passed with Second Division';
    }
    else if (total >= 400) {
        document.getElementById('result').innerHTML =
            'Total: ' + total + '<br>You passed with Third Division';
    }
    else {
        document.getElementById('result').innerHTML =
            'Total: ' + total + '<br>You failed';
            document.getElementById('result').style.backgroundColor = 'red';
    }
}
</script>

</body>
</html>
